<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeTrack - Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="split-page">
        <div class="split-left">
            <div class="brand-side">
                <h1 class="brand-title">CafeTrack</h1>
                <img class="brand-illustration" src="Conversation-amico.svg" alt="Conversation">
            </div>
        </div>

        <div class="split-right">
            <div class="form-card">
                <div class="form-header">
                    <h2 class="form-brand">Merrylane Cafe</h2>
                    <h1 class="form-page-title">Register</h1>
                </div>
                <form id="registerForm" action="index.html" method="post">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Username">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password">
                    </div>

                    <input type="submit" class="btn-submit" value="Register">
                </form>

                <div class="link">
                    <p>Already have an account? <a href="index.html">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $("#registerForm").validate({
                rules:{
                    username:{
                        required: true,
                        minlength: 3,
                        maxlength: 20
                    },
                    email:{
                        required: true,
                        email: true
                    },
                    password:{
                        required: true,
                        minlength: 6
                    },
                    "confirm-password":{
                        required: true,
                        minlength: 6,
                        equalTo: "#password"
                    }
                },
                messages:{
                    username:{
                        required: "Please enter a username",
                        minlength: "Username must be at least 3 characters",
                        maxlength: "Username cannot exceed 20 characters"
                    },
                    email:{
                        required: "Please enter your email",
                        email: "Please enter a valid email address"
                    },
                    password:{
                        required: "Please enter a password",
                        minlength: "Password must be at least 6 characters"
                    },
                    "confirm-password":{
                        required: "Please confirm your password",
                        minlength: "Confirm password must be at least 6 characters",
                        equalTo: "Passwords do not match"
                    }
                }
            });
        });
    </script>
</body>
</html>
