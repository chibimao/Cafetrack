<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeTrack - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="split-page">
        <div class="split-left">
            <div class="brand-side">
                <h1 class="brand-title">CafeTrack</h1>
                <img class="brand-illustration" src="Shops-re-opening-soon-amico.svg" alt="Shops Re-opening">
            </div>
        </div>

        <div class="split-right">
            <div class="form-card">
                <div class="form-header">
                    <h2 class="form-brand">Merrylane Cafe</h2>
                    <h1 class="form-page-title">Login</h1>
                </div>
                <form id="loginForm" action="dashboard.html" method="post">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>

                    <input type="submit" class="btn-submit" value="Login">
                </form>

                <div class="link">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $("#loginForm").validate({
                rules:{
                    username:{
                        required: true,
                        minlength: 3,
                        maxlength: 20
                    },
                    password:{
                        required: true,
                        minlength: 6
                    }
                },
                messages:{
                    username:{
                        required: "Please enter your username",
                        minlength: "Username must be at least 3 characters",
                        maxlength: "Username cannot exceed 20 characters"
                    },
                    password:{
                        required: "Please enter your password",
                        minlength: "Password must be at least 6 characters"
                    }
                }
            });
        });
    </script>
</body>
</html>
